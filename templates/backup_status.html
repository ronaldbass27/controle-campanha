<!DOCTYPE html>
<html>
<head>
    <title>Backup do Sistema</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; max-width: 500px; }
        p { font-size: 16px; color: #333; margin-bottom: 20px; word-break: break-all; }
        a { display: inline-block; padding: 10px 20px; background-color: #0056b3; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h3>Status do Backup</h3>
        <p>{{ mensagem }}</p>
        <a href="/dashboard">Voltar ao Painel</a>
    </div>
</body>
</html>
